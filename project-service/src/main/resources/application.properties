server.port=10000
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:quartzdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin123
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Quartz Configuration
spring.quartz.job-store-type=jdbc
# Give schema management complete control to Flyway
spring.quartz.jdbc.initialize-schema=never
spring.jpa.hibernate.ddl-auto=update

# Enable Flyway
spring.flyway.enabled=true



# Force Quartz to use HSQLDB delegate compatible with H2
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.HSQLDBDelegate
