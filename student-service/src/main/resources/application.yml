server:
  port: 9081
spring:
  application:
    name: student-service
  profiles:
    default: development
management:
  endpoints:
    web:
      include:
        - health
        - info
        - metrics

resilience4j:
  ratelimiter:
    instances:
      getAllStudents:
        limitForPeriod: 5
        limitRefreshPeriod: 1m
        timeoutDuration: 0
