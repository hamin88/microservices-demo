server:
  port: 8080
spring:
  application:
    name: gateway-service
  profiles:
    default: local
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins:
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
      routes:
        - id: auth-login-route
          uri: lb://user-service
          predicates:
            - Path=/api/auth/login
            - Method=POST
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: student-service-route
          uri: lb://student-service
          predicates:
            - Path=/api/students/**
security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}

---
spring:
  config:
    activate:
      on-profile: development
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

---
spring:
  config:
    activate:
      on-profile: local
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
  file :
    name: /C/Applogs/gateway-service.log