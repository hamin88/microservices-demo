server:
  port: 8180
spring:
  application:
    name: gateway-service
  profiles:
    default: development
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10      # max connections
      minimum-idle: 5            # min idle connections
      idle-timeout: 30000        # 30s
      max-lifetime: 1800000      # 30 min
      connection-timeout: 20000  # 20s
      pool-name: UserServicePool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins:
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
      routes:
        - id: auth-login-route
          uri: lb://user-service
          predicates:
            - Path=/api/auth/login
            - Method=POST
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: student-service-route
          uri: lb://student-service
          predicates:
            - Path=/api/students/**
security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
    expiration-seconds: 3600

---
spring:
  config:
    activate:
      on-profile: development
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

---
spring:
  config:
    activate:
      on-profile: local
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
  file :
    name: /C/Applogs/gateway-service.log